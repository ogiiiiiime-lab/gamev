<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire Ledger</title>
<style>
:root{--bg:#f2f2f7;--cd:#fff;--tx:#1c1c1e;--t2:#6c6c70;--ac:#0a7aff;--up:#1a8f3c;--dn:#d70015;--sp:#d1d1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#1c1c1e;--tx:#fff;--t2:#98989f;--ac:#0a84ff;--up:#30d158;--dn:#ff453a;--sp:#38383a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#v{max-width:560px;margin:0 auto;padding:12px 16px 110px}
h1{font-size:34px;letter-spacing:-.5px;margin:8px 0 14px}
.card{background:var(--cd);border-radius:16px;padding:16px;margin-bottom:12px}
.sm{font-size:13px;color:var(--t2)}.big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;padding:7px 0;border-top:.5px solid var(--sp);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.btn,.bt{border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px inherit;font-family:inherit;padding:12px 16px;min-height:44px;cursor:pointer}
.btn.g{background:var(--sp);color:var(--tx)}.bt{padding:8px 12px;font-size:15px;min-width:92px}.bt.off{opacity:.35}
.seg{display:flex;background:var(--sp);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--tx);font:600 14px inherit;font-family:inherit;padding:10px 4px;min-height:44px;border-radius:8px}
.seg .on{background:var(--cd)}
.it,.mk{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cd);padding:12px 14px;border-bottom:.5px solid var(--sp);min-height:56px}
.it:first-of-type,.mk:first-of-type{border-radius:14px 14px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chips button{flex:none;border:0;border-radius:20px;background:var(--cd);color:var(--tx);font:500 14px inherit;font-family:inherit;padding:10px 14px;min-height:44px}
.chips .on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{border:0;border-radius:10px;background:var(--cd);color:var(--tx);padding:6px 0;min-height:52px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.dc i{font-style:normal;font-size:10px;color:var(--t2)}.dc.lock{opacity:.4}.dc.rdy{background:var(--ac);color:#fff}.dc.rdy i{color:#fff}.dc.done{background:var(--sp)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--cd) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sp);z-index:5}
#tabs div{display:flex;width:100%;max-width:560px}
.tb{flex:1;border:0;background:none;color:var(--t2);font:500 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.tb.on{color:var(--ac)}.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;z-index:10}#bk{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.gr{width:40px;height:5px;border-radius:3px;background:var(--sp);margin:0 auto 12px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.ts{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:15px;max-width:90%}
.bar{height:8px;border-radius:4px;background:var(--sp);overflow:hidden;margin-top:8px}.bar b{display:block;height:100%;width:0;background:var(--ac)}
</style></head><body>
<div id="toasts"></div><div id="v"></div>
<nav id="tabs"><div id="tn"></div></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=n=>{const a=Math.abs(n),s=a>=1e12?(a/1e12).toFixed(2)+'T':a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'K':Math.round(a).toLocaleString();return(n<0?'-':'')+'$'+s};
const fp=n=>'$'+n.toFixed(2);
const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return(u-3)/.707};
const TIER=['Starter','Local','Regional','National','Global'];
const C={
bank:['Banking',['Savings Pot','Term Deposit','Bond Ladder','Money Fund','Credit Union','Mortgage Book','Insurance Pool','Leasing Desk','Payments Hub','Private Bank'],400,.008,.05],
biz:['Business',['Cafe','Bakery','Barbershop','Gym','Laundromat','Food Truck','Pizzeria','Car Wash','Flower Shop','Bookstore','Pharmacy','Cinema','Bar','Hotel','Boutique','Dental Clinic','Pet Store','Brewery','Salon','Grocery'],1500,.02,.15],
re:['Real Estate',['Studio Flat','Apartment Block','Office Floor','Retail Unit','Warehouse','Parking Garage','Student Housing','Resort','Farmland','Skyscraper'],8000,.012,.1],
ind:['Industry',['Textile Mill','Steel Plant','Oil Well','Solar Farm','Mine','Chip Fab','Chemical Works','Shipyard','Bottling Line','Wind Park'],6000,.016,.2],
tech:['Technology',['App Studio','SaaS Product','Game Studio','Data Center','AI Lab','Fintech','Robotics Lab','Cyber Firm','Cloud Host','Biotech'],5000,.025,.5],
log:['Logistics',['Courier Van','Truck Fleet','Cargo Ship','Air Freight','Rail Line','Port Terminal','Delivery App','Taxi Fleet','Cold Chain','Drone Network'],4000,.015,.12],
med:['Media',['Podcast','Video Channel','Record Label','Film Studio','Magazine','Radio Station','Sports Club','Streaming Site','Ad Agency','Esports Team'],3000,.02,.35]};
const I=[],ID={};
for(const k in C){const[n,nm,b,r,rk]=C[k];nm.forEach((x,i)=>TIER.forEach((t,j)=>{const o={id:k+i+'_'+j,k,name:t+' '+x,cost:Math.round(b*Math.pow(4.2,j)*(1+i*.12)),r:r*(1+j*.04),rk};I.push(o);ID[o.id]=o}))}
const SEC=['Energy','Bank','Retail','Pharma','Auto','Cloud','Mining','Food','Media','Space'],PRE=['Apex','Nova','Orion','Vertex','Atlas','Zenith','Helix','Quanta','Borealis','Summit'];
const T=[],TD={};
SEC.forEach((s,i)=>PRE.forEach((p,j)=>{const o={id:'t'+i+'_'+j,sym:(p.slice(0,2)+s.slice(0,2)).toUpperCase(),name:p+' '+s,p0:20+((i*7+j*13)%25)*10,v:.012+(i%4)*.008,mu:.0003};T.push(o);TD[o.id]=o}));
let S,tab='home',cat='biz',rv='daily',iv,cur;
function init(){S={day:0,cash:1000,sav:0,debt:0,own:{},sh:{},cost:{},px:{},hist:{},claimed:{},ach:{},mult:1,feed:['Welcome. You start with $1,000. Trade, save, then buy your first business.'],sp:1,over:0};T.forEach(t=>{S.px[t.id]=t.p0;S.hist[t.id]=[t.p0]})}
try{const x=localStorage.getItem('el1');S=x?JSON.parse(x):null}catch(e){S=null}
if(!S||!S.px)init();
const save=()=>{try{localStorage.setItem('el1',JSON.stringify(S))}catch(e){}};
const own=id=>S.own[id]||0,icost=it=>Math.round(it.cost*Math.pow(1.12,own(it.id)));
const assets=()=>I.reduce((a,it)=>a+it.cost*.8*own(it.id),0);
const stocks=()=>T.reduce((a,t)=>a+(S.sh[t.id]||0)*S.px[t.id],0);
const nw=()=>S.cash+S.sav+assets()+stocks()-S.debt;
const income=r=>I.reduce((a,it)=>{const n=own(it.id);return n?a+it.cost*it.r*n*S.mult*(r?1+(Math.random()-.5)*it.rk*2:1):a},0);
const ownN=()=>Object.values(S.own).reduce((a,b)=>a+b,0),catN=k=>I.reduce((a,it)=>it.k==k?a+own(it.id):a,0);
const reward=d=>Math.round(200*(1+d*.08)*(d%30==0?12:d%7==0?3:1));
const AC=[];
[1e4,1e5,1e6,1e7,1e8,1e9,1e10,1e11,1e12].forEach(v=>AC.push({id:'nw'+v,t:'Reach net worth '+fmt(v),b:v*.01,f:()=>nw()>=v}));
[1,10,50,100,250,400].forEach(v=>AC.push({id:'own'+v,t:'Own '+v+' assets',b:v*500,f:()=>ownN()>=v}));
Object.keys(C).forEach(k=>[5,25].forEach(v=>AC.push({id:k+v,t:'Own '+v+' in '+C[k][0],b:v*800,f:()=>catN(k)>=v})));
[30,100,200,365].forEach(d=>AC.push({id:'d'+d,t:'Survive '+d+' days',b:d*300,f:()=>S.day>=d}));
[1e4,1e5,1e6,1e7].forEach(v=>AC.push({id:'sv'+v,t:'Hold '+fmt(v)+' in savings',b:v*.02,f:()=>S.sav>=v}));
[7,30,100,365].forEach(v=>AC.push({id:'cl'+v,t:'Claim '+v+' daily rewards',b:v*400,f:()=>Object.keys(S.claimed).length>=v}));
[1,10,50].forEach(v=>AC.push({id:'st'+v,t:'Hold '+v+' different stocks',b:v*600,f:()=>Object.values(S.sh).filter(x=>x>0).length>=v}));
function toast(m){const e=document.createElement('div');e.className='ts';e.textContent=m;$('#toasts').append(e);gsap.timeline({onComplete:()=>e.remove()}).from(e,{y:-40,autoAlpha:0,scale:.9,duration:.45,ease:'back.out(2)'}).to(e,{autoAlpha:0,y:-20,duration:.3,delay:2.2})}
function feed(m){S.feed.unshift('Day '+S.day+': '+m);S.feed.length=Math.min(S.feed.length,8);const f=$('#feed');if(f){f.innerHTML=S.feed.map(x=>'<div class="row">'+x+'</div>').join('');gsap.from('#feed .row',{x:-16,autoAlpha:0,duration:.4,stagger:.04})}}
function chk(){AC.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;S.cash+=a.b;toast('Achievement: '+a.t+'  +'+fmt(a.b));feed('Achievement unlocked: '+a.t)}})}
const EV=[['Consumer boom: income up 50%',()=>S.mult=1.5],['Recession: income down 40%',()=>S.mult=.6],['Market crash: stocks fall 15%',()=>T.forEach(t=>S.px[t.id]*=.85)],['Market rally: stocks rise 12%',()=>T.forEach(t=>S.px[t.id]*=1.12)],['Tax audit: 5% of your cash is paid',()=>S.cash-=Math.max(0,S.cash)*.05],['Lawsuit settled for 1% of net worth',()=>S.cash-=Math.max(0,nw())*.01],['Export deal: five days of income at once',()=>S.cash+=income()*5]];
function tick(){if(S.over)return;S.day++;const m=gauss()*.008;
T.forEach(t=>{const np=Math.max(1,S.px[t.id]*Math.exp(t.mu+m+gauss()*t.v));S.px[t.id]=np;const h=S.hist[t.id];h.push(np);if(h.length>60)h.shift()});
S.cash+=income(1);S.sav*=1.0003;S.debt*=1.0008;S.mult+=(1-S.mult)*.12;
if(Math.random()<.07){const e=EV[Math.random()*EV.length|0];e[1]();feed(e[0]);toast(e[0])}
if(S.cash<0){S.debt-=S.cash;S.cash=0}
if(S.day==365)toast('One year complete. Net worth '+fmt(nw())+'. Keep building.');
if(nw()<-20000){S.over=1;clearInterval(iv);over()}
chk();live();if(S.day%5==0)save()}
const disp={v:0};
function live(){const w=nw();gsap.to(disp,{v:w,duration:.6,overwrite:true,onUpdate:()=>{const e=$('#nw');if(e)e.textContent=fmt(disp.v)}});
const set=(i,v)=>{const e=$('#'+i);if(e)e.textContent=v};
set('cash',fmt(S.cash));set('sav',fmt(S.sav));set('debt',fmt(S.debt));set('inc',fmt(income()));set('day',S.day);
const pb=$('#pb');if(pb)pb.style.width=Math.min(100,S.day/3.65)+'%';
$$('[data-p]').forEach(e=>{const id=e.dataset.p;e.textContent=fp(S.px[id])});
$$('[data-c]').forEach(e=>{const h=S.hist[e.dataset.c],c=h.length>1?(h[h.length-1]/h[h.length-2]-1)*100:0;e.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';e.className=c>=0?'up':'dn'});
$$('[data-b]').forEach(e=>e.classList.toggle('off',S.cash<icost(ID[e.dataset.b])))}
const H=()=>`<h1>Overview</h1><div class="card"><div class="sm">Net worth</div><div class="big" id="nw"></div><div class="row"><span>Cash</span><b id="cash"></b></div><div class="row"><span>Savings</span><b id="sav"></b></div><div class="row"><span>Debt</span><b id="debt"></b></div><div class="row"><span>Income per day</span><b id="inc"></b></div></div>
<div class="card"><div class="row" style="border:0"><span>Day <b id="day"></b> of 365</span><button class="btn g" data-a="bank">Bank and loans</button></div><div class="bar"><b id="pb"></b></div>
<div class="seg" style="margin:14px 0 0">${['Pause','1x','4x','12x'].map((x,i)=>`<button class="${S.sp==i?'on':''}" data-a="speed|${i}">${x}</button>`).join('')}</div></div>
<div class="card"><div class="sm">Activity</div><div id="feed">${S.feed.map(x=>'<div class="row">'+x+'</div>').join('')}</div></div>`;
const M=()=>`<h1>Markets</h1><div>${T.map(t=>`<div class="mk" data-a="stock|${t.id}"><div><b>${t.sym}</b><div class="sm">${t.name}${S.sh[t.id]?' - '+S.sh[t.id]+' held':''}</div></div><div style="text-align:right"><b data-p="${t.id}"></b><div class="sm" data-c="${t.id}"></div></div></div>`).join('')}</div>`;
const E=()=>`<h1>Empire</h1><div class="chips">${Object.keys(C).map(k=>`<button class="${k==cat?'on':''}" data-a="chip|${k}">${C[k][0]}</button>`).join('')}</div><div id="list">${list()}</div>`;
const list=()=>I.filter(i=>i.k==cat).map(it=>`<div class="it"><div><b>${it.name}</b><div class="sm">+${fmt(it.cost*it.r)}/day each - owned ${own(it.id)}</div></div><button class="bt" data-b="${it.id}" data-a="buy|${it.id}">${fmt(icost(it))}</button></div>`).join('');
const R_=()=>{const n=Object.keys(S.claimed).length,na=Object.keys(S.ach).length;return`<h1>Rewards</h1><div class="seg"><button class="${rv=='daily'?'on':''}" data-a="rv|daily">365 Days</button><button class="${rv=='ach'?'on':''}" data-a="rv|ach">Achievements ${na}/${AC.length}</button></div>`+(rv=='daily'?`<div class="card"><div class="row" style="border:0"><span>Claimed <b id="cn">${n}</b> of 365</span><button class="btn" data-a="claimAll">Claim all ready</button></div></div><div class="grid">${Array.from({length:365},(_,i)=>{const d=i+1,st=S.claimed[d]?'done':S.day>=d?'rdy':'lock';return`<button class="dc ${st}" data-d="${d}" data-a="claim|${d}"><span>${d}</span><i>${fmt(reward(d))}</i></button>`}).join('')}</div>`:`<div>${AC.map(a=>`<div class="it" style="opacity:${S.ach[a.id]?1:.55}"><div><b>${a.t}</b><div class="sm">Reward ${fmt(a.b)}</div></div><b class="${S.ach[a.id]?'up':''}">${S.ach[a.id]?'Done':'Locked'}</b></div>`).join('')}</div>`)};
const RN={home:H,market:M,empire:E,rewards:R_};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',market:'<path d="M3 17l5-6 4 3 8-9M15 5h5v5"/>',empire:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>',rewards:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 21h8"/>'};
$('#tn').innerHTML=Object.keys(IC).map(k=>`<button class="tb" data-a="tab|${k}" data-t="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
function go(t,first){tab=t;$$('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==t));const v=$('#v');
const fill=()=>{v.innerHTML=RN[t]();window.scrollTo(0,0);gsap.set(v,{y:0});gsap.to(v,{autoAlpha:1,duration:.2});gsap.from(v.querySelectorAll('.card,.it,.mk,.dc,h1,.chips,.seg'),{y:20,autoAlpha:0,duration:.5,ease:'power2.out',stagger:{amount:.6}});if(!RM)gsap.to('.rdy',{scale:1.08,repeat:-1,yoyo:true,duration:.7,ease:'sine.inOut'});live()};
first?fill():gsap.to(v,{autoAlpha:0,y:8,duration:.12,onComplete:fill})}
function sheet(h){close(1);const o=document.createElement('div');o.id='ov';o.innerHTML=`<div id="bk" data-a="close"></div><div id="sh"><div class="gr"></div><div id="sb">${h}</div></div>`;document.body.append(o);gsap.from('#bk',{autoAlpha:0,duration:.3});gsap.from('#sh',{yPercent:100,duration:.5,ease:'power3.out'});live()}
function close(now){const o=$('#ov');if(!o)return;if(now===1){o.remove();return}gsap.to('#sh',{yPercent:100,duration:.3,ease:'power2.in'});gsap.to('#bk',{autoAlpha:0,duration:.3,onComplete:()=>o.remove()})}
const bankH=()=>{const lim=Math.max(5000,(nw()+S.debt)*.8);return`<h1 style="font-size:28px">Bank</h1><div class="card"><div class="row" style="border:0"><span>Savings (about 11% a year)</span><b>${fmt(S.sav)}</b></div><div class="acts"><button class="btn g" data-a="dep|.25">Add 25%</button><button class="btn g" data-a="dep|1">Add all</button><button class="btn g" data-a="wd">Withdraw</button></div></div><div class="card"><div class="row" style="border:0"><span>Debt (about 33% a year)</span><b>${fmt(S.debt)}</b></div><div class="sm">Borrowing limit ${fmt(lim)}</div><div class="acts"><button class="btn g" data-a="borrow|1000">Borrow 1K</button><button class="btn g" data-a="borrow|25000">Borrow 25K</button><button class="btn" data-a="repay">Repay</button></div></div>`};
function sparkH(h){const mn=Math.min(...h),mx=Math.max(...h),w=300,hh=90;return`<svg viewBox="0 0 ${w} ${hh}" width="100%" height="90"><path id="sp" pathLength="1" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1" d="${h.map((v,i)=>(i?'L':'M')+(i/Math.max(h.length-1,1)*w).toFixed(1)+' '+(hh-4-(v-mn)/(mx-mn||1)*(hh-8)).toFixed(1)).join('')}"/></svg>`}
const stockH=id=>{const t=TD[id];return`<h1 style="font-size:28px;margin-bottom:4px">${t.sym}</h1><div class="sm">${t.name}</div><div class="big" data-p="${id}" style="font-size:32px"></div>${sparkH(S.hist[id])}<div class="row"><span>Shares held</span><b>${S.sh[id]||0}</b></div><div class="acts"><button class="btn" data-a="tb|${id}|1">Buy 1</button><button class="btn" data-a="tb|${id}|10">Buy 10</button><button class="btn" data-a="tb|${id}|max">Buy max</button><button class="btn g" data-a="ts|${id}|1">Sell 1</button><button class="btn g" data-a="ts|${id}|10">Sell 10</button><button class="btn g" data-a="ts|${id}|all">Sell all</button></div>`};
function over(){sheet(`<h1 style="font-size:28px">Bankrupt</h1><p>Debt overwhelmed your empire on day ${S.day}. Your lessons carry on.</p><button class="btn" data-a="restart">Start again</button>`)}
const pop=e=>e&&!RM&&gsap.fromTo(e,{scale:.9},{scale:1,duration:.5,ease:'back.out(3)'});
const flash=c=>{const e=$('#cash');e&&!RM&&gsap.fromTo(e,{color:c},{color:'inherit',duration:.8})};
const A={
tab:t=>go(t),close:()=>close(),speed:n=>{S.sp=+n;clearInterval(iv);if(+n)iv=setInterval(tick,[0,1500,400,120][+n]);$$('.seg button').forEach((b,i)=>b.classList.toggle('on',i==+n))},
bank:()=>sheet(bankH()),
dep:f=>{const x=S.cash*+f;S.cash-=x;S.sav+=x;$('#sb').innerHTML=bankH();live()},
wd:()=>{S.cash+=S.sav;S.sav=0;$('#sb').innerHTML=bankH();live()},
borrow:x=>{const lim=Math.max(5000,(nw()+S.debt)*.8);if(S.debt+ +x>lim)return toast('Over your borrowing limit');S.debt+= +x;S.cash+= +x;$('#sb').innerHTML=bankH();live();flash('#1a8f3c')},
repay:()=>{const x=Math.min(S.cash,S.debt);S.cash-=x;S.debt-=x;$('#sb').innerHTML=bankH();live()},
chip:k=>{cat=k;go('empire')},rv:v=>{rv=v;go('rewards')},
buy:(id,e)=>{const it=ID[id],c=icost(it);if(S.cash<c)return toast('Not enough cash');S.cash-=c;S.own[id]=own(id)+1;const b=$(`[data-b="${id}"]`);b.textContent=fmt(icost(it));b.previousElementSibling.lastChild.textContent='+'+fmt(it.cost*it.r)+'/day each - owned '+own(id);pop(b);flash('#d70015');chk();live();save()},
stock:id=>{cur=id;sheet(stockH(id));if(!RM)gsap.fromTo('#sp',{strokeDashoffset:1},{strokeDashoffset:0,duration:.9,ease:'power2.out'})},
tb:(id,n)=>{const p=S.px[id],q=n=='max'?Math.floor(S.cash/p):+n;if(q<1||q*p>S.cash)return toast('Not enough cash');S.cash-=q*p;S.sh[id]=(S.sh[id]||0)+q;$('#sb').innerHTML=stockH(id);flash('#d70015');chk();live();save()},
ts:(id,n)=>{const h=S.sh[id]||0,q=n=='all'?h:Math.min(h,+n);if(q<1)return;S.cash+=q*S.px[id];S.sh[id]=h-q;$('#sb').innerHTML=stockH(id);flash('#1a8f3c');chk();live();save()},
claim:d=>{d=+d;if(S.claimed[d]||S.day<d)return;S.claimed[d]=1;S.cash+=reward(d);const e=$(`[data-d="${d}"]`);if(e){gsap.killTweensOf(e);e.className='dc done';pop(e);$('#cn').textContent=Object.keys(S.claimed).length}toast('Day '+d+' reward  +'+fmt(reward(d)));chk();live();save()},
claimAll:()=>{let n=0;for(let d=1;d<=Math.min(S.day,365);d++)if(!S.claimed[d]){S.claimed[d]=1;S.cash+=reward(d);n++}n?go('rewards'):toast('Nothing ready yet. Let days pass.');chk();live();save()},
restart:()=>{close(1);init();A.speed(1);go('home');save()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[n,...a]=b.dataset.a.split('|');A[n]&&A[n](...a)});
A.speed(S.over?0:S.sp);go('home',1);
if(S.over)over();
</script></body></html>
